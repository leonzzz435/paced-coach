name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:
  lint-and-test:
    if: |
      github.event_name == 'pull_request' ||
      (
        !contains(github.event.head_commit.message, '[skip ci]') &&
        !contains(github.event.head_commit.message, '[ci skip]')
      )
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paced_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paced_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      API_BASE_URL: "http://127.0.0.1:8000"
      OPENAI_API_KEY: "sk-TEST"
      AI_MODE: "cost_effective"
      APP_ENV: "test"
      AUTH_MODE: "local"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/paced_test"
      HEAD_COACH_TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/paced_test"
      HEAD_COACH_MIGRATION_TEST_ADMIN_URL: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Install web dependencies
        working-directory: web/app
        run: npm ci

      - name: Web lint
        working-directory: web/app
        run: npm run lint

      - name: Web type check
        working-directory: web/app
        run: npm run type-check

      - name: Web tests
        working-directory: web/app
        run: npm run test

      - name: Web build
        working-directory: web/app
        run: npm run build

      - name: Install pixi
        shell: bash
        run: |
          bash ./scripts/install_pixi.sh "$HOME/.pixi/bin"
          echo "$HOME/.pixi/bin" >> $GITHUB_PATH

      - name: Pixi version
        run: pixi --version

      - name: Install dependencies
        run: pixi install -q

      - name: Check version manifest sync
        run: pixi run check-version-manifest

      - name: Check version governance coverage
        run: pixi run check-version-governance

      - name: Lint (ruff)
        run: pixi run lint-ruff

      - name: Type Check (mypy)
        run: pixi run type-check

      - name: Apply test database migrations
        run: pixi run alembic -c alembic.ini upgrade head

      - name: Head Coach PostgreSQL durability and migration tests
        run: pixi run pytest -q tests/test_head_coach_postgres_integration.py tests/test_release_migration_contract.py

      - name: Run tests
        run: pixi run test
